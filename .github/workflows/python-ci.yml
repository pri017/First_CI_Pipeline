# Workflow displayed in the GitHub Actions tab.
name: Python CI

# Test every push to main and every pull request targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Tests only need read access to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest  # Run on a fresh Linux machine.
    steps:
      # Download the repository files.
      - name: Check out code
        uses: actions/checkout@v4
      # Use the Python version specified by the assignment.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Install the test dependency from the shared requirements file.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      # A failing test makes the workflow fail automatically.
      - name: Run tests
        run: python -m pytest -v
